name: CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swiftc -O -o VirtualDisplay VirtualDisplay.swift

      - name: Verify binary
        run: test -x VirtualDisplay && file VirtualDisplay

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDisplay
          path: VirtualDisplay
