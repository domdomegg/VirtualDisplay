name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swiftc -O -o displayoverride DisplayOverride.swift

      - name: Verify binary
        run: test -x displayoverride && file displayoverride

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: displayoverride
          path: displayoverride
